<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>T-Shirt Shop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header>
    <h1>T-Shirt Shop</h1>
    <p>Vanilla JavaScript CRUD App</p>
    <p id="product-count">0 products</p>
  </header>

  <!-- Add Product Form -->
  <section id="form-section">
    <h2>Add New T-Shirt</h2>

    <form id="product-form">
      
      <label>
        Title
        <input type="text" id="title" placeholder="Ex: Oversized Black Tee" required>
      </label>

      <label>
        Price
        <input type="number" id="price" value="0" required>
      </label>

      <label>
        Size
        <select id="size" required>
          <option value="">Choose size</option>
          <option value="S">S</option>
          <option value="M">M</option>
          <option value="L">L</option>
          <option value="XL">XL</option>
        </select>
      </label>

      <label>
        Color
        <input type="text" id="color" placeholder="Ex: White">
      </label>

      <label>
        Image URL
        <input type="text" id="image" placeholder="https://...">
      </label>

      <label>
        <input type="checkbox" id="inStock" checked>
        In Stock
      </label>

      <div class="buttons">
        <button type="submit">Add Product</button>
        <button type="button" id="cancel-btn">Cancel Edit</button>
      </div>

    </form>
  </section>

  <!-- Products Section -->
  <section id="products-section">
    <h2>Products</h2>

    <div class="controls">
      <input type="text" id="search" placeholder="Search by title...">

      <select id="filter">
        <option value="all">All Stock</option>
        <option value="in">In Stock</option>
        <option value="out">Out of Stock</option>
      </select>

      <select id="sort">
        <option value="">Sort By</option>
        <option value="price-asc">Price (Low → High)</option>
        <option value="price-desc">Price (High → Low)</option>
      </select>
    </div>

    <!-- Products List -->
    <div id="products-container"></div>

  </section>

</body>
</html>
