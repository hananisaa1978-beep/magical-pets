<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Magical Pet Sanctuary</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>🧙‍♀️ Magical Pet Sanctuary</h1>
    <button id="openFormBtn">Adopt New Pet 🐾</button>
  </header>

  <!-- FORM -->
  <div id="formContainer" class="hidden">
    <form id="petForm">
      <input type="text" id="name" placeholder="Pet Name" required />

      <select id="type" required>
        <option value="">Select Type</option>
        <option>Dragon 🐉</option>
        <option>Unicorn 🦄</option>
        <option>Phoenix 🔥</option>
        <option>Fairy 🧚</option>
        <option>Griffin 🦅</option>
      </select>

      <input type="text" id="color" placeholder="Color" required />

      <textarea id="description" placeholder="Description" required></textarea>

      <button type="submit">Adopt ✨</button>
    </form>
  </div>

  <!-- PET GRID -->
  <div id="petContainer" class="grid"></div>

  <script src="script.js"></script>
</body>
</html>
